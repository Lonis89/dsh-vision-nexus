<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="dsh-vision-nexus">
  <title>dsh-vision-nexus</title>
  <defs>
    <linearGradient id="vn-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="vn-lens" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#c7d2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底板：圆角方块 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#vn-grad)"/>

  <!-- 视觉中枢：同心环 -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- 瞳孔高光 -->
  <circle cx="32" cy="32" r="7" fill="url(#vn-lens)"/>
  <circle cx="32" cy="32" r="3.2" fill="#ffffff" fill-opacity="0.92"/>

  <!-- nexus：四向节点与连线，呼应"中枢"语义 -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="11"/>
    <line x1="32" y1="32" x2="53" y2="32"/>
    <line x1="32" y1="32" x2="32" y2="53"/>
    <line x1="32" y1="32" x2="11" y2="32"/>
  </g>
  <g fill="#ffffff">
    <circle cx="32" cy="11" r="2.6"/>
    <circle cx="53" cy="32" r="2.6"/>
    <circle cx="32" cy="53" r="2.6"/>
    <circle cx="11" cy="32" r="2.6"/>
  </g>
</svg>
